services:
  web:
    build:
      context: .
      target: production
    environment:
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env or the shell}
      DEBUG: "False"
      DJANGO_COLLECTSTATIC: "1"
      POSTGRES_HOST: db
      POSTGRES_DB: ${POSTGRES_DB:-frams}
      POSTGRES_USER: ${POSTGRES_USER:-bloggenius}
      POSTGRES_PASS: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env or the shell}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env or the shell}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-True}
      EMAIL_HOST: ${EMAIL_HOST:-}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      EMAIL_PORT: ${EMAIL_PORT:-587}
    ports:
      - "8000:8000"
    volumes:
      - media:/app/media
    depends_on:
      - db
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-frams}
      POSTGRES_USER: ${POSTGRES_USER:-bloggenius}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bloggenius}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
  media:
